<!doctype html>
<html
  lang="tr"
  data-theme="dark"
  class="overscroll-none touch-none select-none"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>ADAŞ - Aile Davranış Analiz Sistemi</title>

    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Firebase v8 SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  </head>

  <body
    class="min-h-screen flex items-center justify-center p-4 overscroll-none text-slate-100 font-sans"
  >
    <!-- Toast Bildirim Alanı -->
    <div
      id="toastContainer"
      class="fixed top-5 right-5 z-50 space-y-3 pointer-events-none"
    ></div>

    <!-- Giriş Kartı -->
    <div class="w-full max-w-md login-card p-6 md:p-8 relative">
      <!-- Üst Butonlar (Mobil Çakışma Düzeltildi) -->
      <div class="flex items-center justify-between mb-4">
        <span
          class="text-[10px] font-bold uppercase tracking-widest text-slate-400 sub-title-text"
        >
          ADAŞ v2026
        </span>
        <div class="flex items-center gap-2 z-10">
          <button
            type="button"
            id="btnTogglePerformance"
            title="Performans Modu"
            class="adas-btn text-xs px-3 py-1.5 rounded-full cursor-pointer"
          >
            ⚡ Performans
          </button>
          <button
            type="button"
            id="btnToggleTheme"
            title="Temayı Değiştir"
            class="adas-btn text-amber-400 w-9 h-9 rounded-full flex items-center justify-center cursor-pointer"
          >
            🌓
          </button>
        </div>
      </div>

      <!-- Başlık -->
      <div class="text-center mb-8">
        <h1
          class="text-4xl font-black tracking-wider text-orange-500 mb-1 drop-shadow-md"
        >
          ADAŞ
        </h1>
        <p
          class="text-[10px] font-bold uppercase tracking-widest text-slate-400 sub-title-text"
        >
          Aile Davranış Analiz Sistemi
        </p>
      </div>

      <!-- Yükleniyor Alanı -->
      <div id="loadingArea" class="py-10 text-center space-y-4">
        <div
          class="w-10 h-10 border-4 border-orange-500 border-t-transparent rounded-full animate-spin mx-auto"
        ></div>
        <p class="text-xs font-medium text-slate-400 loading-text">
          Güvenli veritabanı köprüsü kuruluyor...
        </p>
      </div>

      <!-- Giriş Formu -->
      <form id="loginForm" class="hidden space-y-5">
        <!-- ÖZEL PEEK & POP DROPDOWN: Aile Seçimi -->
        <div class="space-y-1.5 relative">
          <label
            class="block text-xs uppercase tracking-wider font-bold label-text"
          >
            Aile Grubunuz
          </label>
          <div
            id="selectFamilyTrigger"
            class="custom-select-trigger peek-target w-full p-3.5 text-sm font-medium flex items-center justify-between rounded-2xl cursor-pointer"
            data-target-menu="menuFamilies"
          >
            <span id="lblSelectedFamily" class="blur-text-layer inline-block"
              >-- Lütfen Ailenizi Seçin --</span
            >
            <i class="fa-solid fa-chevron-down text-xs opacity-60"></i>
          </div>

          <!-- Özel iOS Baloncuklu Açılır Menü -->
          <div id="menuFamilies" class="ios-bubble-menu"></div>

          <select id="cmbFamilies" class="hidden">
            <option value="" disabled selected>
              -- Lütfen Ailenizi Seçin --
            </option>
          </select>
        </div>

        <!-- ÖZEL PEEK & POP DROPDOWN: Üye Seçimi -->
        <div class="space-y-1.5 relative">
          <label
            class="block text-xs uppercase tracking-wider font-bold label-text"
          >
            Aile Üyesi
          </label>
          <div
            id="selectMemberTrigger"
            class="custom-select-trigger peek-target w-full p-3.5 text-sm font-medium flex items-center justify-between rounded-2xl cursor-pointer opacity-50 pointer-events-none"
            data-target-menu="menuMembers"
          >
            <span id="lblSelectedMember" class="blur-text-layer inline-block"
              >-- Önce Aile Seçin --</span
            >
            <i class="fa-solid fa-chevron-down text-xs opacity-60"></i>
          </div>

          <div id="menuMembers" class="ios-bubble-menu"></div>
          <select id="cmbMembers" class="hidden" disabled>
            <option value="" disabled selected>-- Önce Aile Seçin --</option>
          </select>
        </div>

        <!-- Şifre Girisi -->
        <div class="space-y-1.5 relative">
          <div class="flex justify-between items-center">
            <label
              class="block text-xs uppercase tracking-wider font-bold label-text"
            >
              Giriş Şifresi
            </label>
            <button
              type="button"
              id="btnForgotPass"
              class="text-xs text-orange-400 hover:text-orange-300 font-semibold cursor-pointer transition"
            >
              Şifremi Unuttum?
            </button>
          </div>
          <div class="relative">
            <input
              type="password"
              id="txtPassword"
              placeholder="••••••••"
              class="w-full p-3.5 text-sm font-mono tracking-widest focus:outline-none animated-char-input"
            />
          </div>
        </div>

        <!-- Güvenlik Doğrulaması -->
        <div
          class="p-4 rounded-2xl border border-white/10 bg-black/20 space-y-2.5 captcha-box"
        >
          <label
            class="block text-xs uppercase tracking-wider text-orange-400 font-black"
          >
            Güvenlik Doğrulaması
          </label>
          <div class="grid grid-cols-3 gap-3 items-center">
            <div
              id="lblCaptchaSoru"
              class="col-span-1 text-center py-2.5 rounded-xl text-sm font-black text-amber-400 bg-black/40 border border-white/10"
            >
              0 + 0 =
            </div>
            <input
              type="number"
              id="txtCaptchaCevap"
              placeholder="Cevap?"
              class="col-span-2 w-full p-2.5 text-center text-sm font-bold focus:outline-none animated-char-input"
            />
          </div>
        </div>

        <!-- Swift 2026 Buton -->
        <button
          type="submit"
          class="adas-btn w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-2xl text-sm tracking-wider uppercase shadow-lg cursor-pointer mt-3"
        >
          Sisteme Güvenli Giriş Yap
        </button>
      </form>
    </div>

    <!-- Scriptler -->
    <script type="module" src="assets/js/firebase-config.js"></script>
    <script type="module" src="assets/js/theme-engine.js"></script>
    <script type="module" src="assets/js/peek-pop.js"></script>
    <script type="module" src="assets/js/auth.js"></script>
  </body>
</html>
