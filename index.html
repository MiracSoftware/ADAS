<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADAS - Aile Davranış Analiz Sistemi</title>
    <link rel="stylesheet" href="assets/css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>

  <body
    class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4"
  >
    <div
      id="toastContainer"
      class="fixed top-5 right-5 -50 space-y-3 pointer-events-none"
    ></div>
     <div
      class="w-full max-w-md login-card rounded-2xl p-6 md:p-8 relative border border-slate-700 bg-slate-800 shadow-2xl"
    >
      <div class="absolute top-4 right-4 flex items-center gap-2 z-10">
        <button
          type="button"
          id="btnTogglePerformance"
          title="Performans Modu"
          class="performance-toggle"
        >
          Performans Modu
        </button>
        <button
          type="button"
          id="btnToggleTheme"
          title="Temayı Değiştir"
          class="bg-white/5 hover:bg-white/10 text-amber-400 p-2 rounded-lg text-xs flex items-center justify-center w-8 h-8 border border-white/10 cursor-pointer"
        >
          🌓
        </button>
      </div>

      <div class="text-center mb-6 mt-2">
        <h1 class="text-3xl font-black tracking-wider text-orange-500 mb-1">
          ADAŞ
        </h1>
        <p
          class="text-[11px] opacity-70 font-bold uppercase tracking-widest text-slate-400"
        >
          Aile Davranış Analiz Sistemi
        </p>
      </div>

      <div id="loadingArea" class="py-8 text-center space-y-3">
        <div
          class="w-8 h-8 border-4 border-orange-500 border-t-transparent rounded-full animate-spin mx-auto"
        ></div>
        <p class="text-sm opacity-60 font-medium text-slate-400">
          Güvenli veritabanı köprüsü kuruluyor... Uzun sürebilir, lütfen
          bekleyin.
        </p>
      </div>

      <form id="loginForm" class="hidden space-y-5">
        <div class="space-y-1">
          <label
            class="block text-xs uppercase tracking-wider opacity-80 font-bold text-slate-300"
            >Aile Grubunuz</label
          >
          <select
            id="cmbFamilies"
            class="w-full rounded-xl p-3 text-sm font-medium cursor-pointer bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-orange-500"
          >
            <option value="" disabled selected>
              -- Lütfen Ailenizi Seçin --
            </option>
          </select>
        </div>

        <div class="space-y-1">
          <label
            class="block text-xs uppercase tracking-wider opacity-80 font-bold text-slate-300"
            >Aile Üyesi</label
          >
          <select
            id="cmbMembers"
            class="w-full rounded-xl p-3 text-sm font-medium cursor-pointer bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-orange-500"
            disabled
          >
            <option value="" disabled selected>-- Önce Aile Seçin --</option>
          </select>
        </div>

        <div class="space-y-1 relative">
          <div class="flex justify-between items-center">
            <label
              class="block text-xs uppercase tracking-wider opacity-80 font-bold text-slate-300"
              >Giriş Şifresi</label
            >
            <button
              type="button"
              id="btnForgotPass"
              class="text-xs text-orange-400 hover:text-orange-300 font-semibold cursor-pointer transition"
            >
            </button>
          </div>
          <input
            type="password"
            id="txtPassword"
            placeholder="••••••••"
            class="w-full rounded-xl p-3 text-sm font-mono tracking-widest bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-orange-500"
          />
        </div>

        <div
          class="bg-black/30 p-3.5 rounded-xl border border-white/10 space-y-2.5"
        >
          <label
            class="block text-xs uppercase tracking-wider text-orange-400 font-black"
            >Güvenlik Doğrulaması</label
          >
          <div class="grid grid-cols-3 gap-2.5 items-center">
            <div
              id="lblCaptchaSoru"
              class="col-span-1 text-center py-2.5 rounded-lg text-sm font-black text-amber-400 border border-white/5 bg-slate-950 shadow-inner"
            >
              0 + 0 =
            </div>
            <input
              type="number"
              id="txtCaptchaCevap"
              placeholder="Cevap?"
              class="w-full rounded-lg p-2.5 text-center text-sm font-bold bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-orange-500"
            />
          </div>
        </div>

        <button
          type="submit"
          class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 rounded-xl text-sm tracking-wider uppercase shadow-lg transition-all duration-200 mt-2 cursor-pointer"
        >
          Sisteme Güvenli Giriş Yap
        </button>
      </form>
    </div>

    <div
      id="resetPasswordModal"
      class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-all duration-300"
    >
      <div
        class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl relative transform scale-95 transition-all duration-300"
      >
        <h3
          class="text-xl font-black text-orange-500 mb-2 flex items-center gap-2"
        >
          <i class="fa-solid fa-user-shield"></i> Hesap Doğrulama ve Sıfırlama
        </h3>
        <p class="text-xs text-slate-400 mb-4 uppercase tracking-wide">
          Seçilen Üye:
          <span id="lblResettingUser" class="text-white font-bold">---</span>
        </p>

        <form id="resetPasswordForm" class="space-y-4">
          <div
            class="bg-slate-900 p-3.5 rounded-xl border border-slate-700 space-y-2"
          >
            <label
              class="block text-xs uppercase tracking-wider text-amber-400 font-bold"
              >Hesabın Size Ait Olduğunu Doğrulayın</label
            >
            <div class="grid grid-cols-3 gap-2.5 items-center">
              <div
                id="lblModalCaptchaSoru"
                class="col-span-1 text-center py-2.5 rounded-lg text-sm font-black text-orange-400 bg-slate-950 border border-slate-800 shadow-inner"
              >
                0 x 0 =
              </div>
              <input
                type="number"
                id="txtModalCaptchaCevap"
                required
                placeholder="Cevap?"
                class="w-full rounded-lg p-2.5 text-center text-sm font-bold bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-orange-500"
              />
            </div>
          </div>

          <div>
            <label
              class="block text-xs uppercase tracking-wider text-slate-300 font-bold mb-1"
              >Yeni Güvenli Şifre</label
            >
            <input
              type="password"
              id="txtNewPassword"
              required
              placeholder="••••••••"
              class="w-full rounded-xl p-3 text-sm font-mono bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-orange-500"
            />
          </div>

          <div>
            <label
              class="block text-xs uppercase tracking-wider text-slate-300 font-bold mb-1"
              >Yeni Şifre (Tekrar)</label
            >
            <input
              type="password"
              id="txtNewPasswordConfirm"
              required
              placeholder="••••••••"
              class="w-full rounded-xl p-3 text-sm font-mono bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-orange-500"
            />
          </div>

          <div class="flex gap-3 mt-5">
            <button
              type="button"
              id="btnCancelReset"
              class="w-1/3 bg-slate-700 hover:bg-slate-600 text-slate-200 py-3 rounded-xl text-xs uppercase font-bold transition cursor-pointer"
            >
              İptal
            </button>
            <button
              type="submit"
              class="w-2/3 bg-orange-600 hover:bg-orange-700 text-white py-3 rounded-xl text-xs uppercase font-bold tracking-wider shadow-lg transition cursor-pointer"
            >
              Şifreyi Güncelle
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="assets/js/firebase-config.js"></script>
    <script type="module" src="assets/js/theme-engine.js"></script>
    <script type="module" src="assets/js/auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <div
      class="fixed bottom-3 left-4 z-40 text-[11px] font-mono tracking-wider opacity-30 hover:opacity-100 transition-opacity duration-200 pointer-events-none select-none text-white"
    >
      ADAS version 1.6 <br />
      powered by MiracOS
    </div>
    <a href="root/index.html"><button>Yönetim Paneli</button></a>
    
  </body>
</html>
</html>
</html>
